<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!--<meta http-equiv="refresh" content="5; url=/login">  Use this line if you want to refresh automatically-->
	<title>Acceso denegado</title>
	<style>
		body {
			align-items: center;
			background: #f4f6f8;
			color: #263238;
			display: flex;
			font-family: Arial, sans-serif;
			justify-content: center;
			margin: 0;
			min-height: 100vh;
			text-align: center;
		}

		.card {
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
			max-width: 480px;
			padding: 40px 32px;
		}

		h1 { color: #d32f2f; margin: 0 0 16px; }
		p { line-height: 1.5; }

		a {
			background: #1976d2;
			border-radius: 6px;
			color: #fff;
			display: inline-block;
			margin-top: 16px;
			padding: 12px 24px;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Acceso denegado</h1>
		<p>No estás autorizado para acceder a esta página. Tu sesión puede haber expirado o no tienes permisos suficientes.</p>
		<p>Serás redirigido al inicio de sesión en unos segundos.</p>
		<a href="/">Ir al inicio de sesión</a>
	</main>
</body>
</html>
