spring.application.name=api-appointments
server.port=8083

# Configuration of the database connection
## Chain of connection to the database
spring.datasource.url=${DB_URL}
## User and password to connect to the database
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
## Driver class name for the database connection
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
## Database type for JPA
spring.jpa.database=MYSQL
## SQL statements format
spring.jpa.properties.hibernate.format_sql=false
## Show the SQL statements in the console (Disabled for production environments)
spring.jpa.show-sql=false
## Enable the generation of the database from JPA entities (Disabled for production environments)
spring.jpa.hibernate.ddl-auto=none


# Actuator Configuration
## Path where the Actuator endpoints will be exposed
management.endpoints.web.base-path=/
## Port where the Actuator endpoints will be exposed (Different from the main application port)
management.server.port=9999
## Enable all Actuator endpoints
management.endpoints.web.exposure.include=*
## Show detailed information for the health endpoint
management.endpoint.health.show-details=always
## Enable or disable the health endpoint
### Disable the database health endpoint so it doesn't appear in the general health endpoint
management.health.db.enabled=false
### Disable the disk space health endpoint so it doesn't appear in the general health endpoint
management.health.diskspace.enabled=false

#Prometheus + Grafana
## Enable the Prometheus metrics export endpoint
management.prometheus.metrics.export.enabled=true


# Swagger Configuration
## Specifies the path where the API contract will be published
springdoc.api-docs.path=/api-docs
## Specifies the path where the Swagger UI will be published
springdoc.swagger-ui.path=/
## Specifies swagger-ui to be enabled or disabled
springdoc.swagger-ui.enabled=true
## Configuration of the swagger interface
## Specifies the order of the endpoints in the swagger interface (# Order by method | # Alphabetical order)
springdoc.swagger-ui.operationsSorter=method
## Stablish the title of the API in the swagger interface
springdoc.open-api.info.title=API APPOINTMENTS
## Specifies the description of the API in the swagger interface
springdoc.open-api.info.description=API REST for appointments management
## Specifies the version of the API
springdoc.open-api.info.version=1.0.0
## Specifies the name of the API developer
#springdoc.open-api.info.contact.name=MJUAREZP
## Specifies the email of the API developer
#springdoc.open-api.info.contact.email=MJUAREZP@PUCP.EDU.PE
## Specifies the URL of the API developer
#springdoc.open-api.info.contact.url=FB.COM/...
## Specifies the name of the API license
#springdoc.open-api.info.license.name=...


# Connect as a client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Stablish the hostname and instance ID for this service
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Specify the health check and status page URLs for this service
eureka.instance.status-page-url-path=/
eureka.instance.home-page-url-path=/

# We link the swagger ui path to the eureka instance status page and home page URLs
eureka.instance.status-page-url=http://localhost:8083/
eureka.instance.home-page-url=http://localhost:8083/