spring.application.name=apim

# Eureka client configuration
## Port where the application will run
server.port=8000
## Specify the URL of the Eureka server for service registration
eureka.client.service-url.default-zone=http://localhost:8761/eureka
## Specify hostname where is the application running
eureka.instance.hostname=localhost
## Personalize the instance ID of the application in Eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}


## With this library the controller won't be necessary
# Add if you want to use the default route configuration provided by Spring Cloud Gateway
spring.main.web-application-type=reactive
# Configuration for Spring Cloud Gateway routes
#Configuration api gateway routes[0]
spring.cloud.gateway.server.webflux.routes[0].id=api-patients
spring.cloud.gateway.server.webflux.routes[0].uri=lb://api-patients
spring.cloud.gateway.server.webflux.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[0].predicates[0].args[pattern]=/patients/**
#Configuration api gateway routes[1]
spring.cloud.gateway.server.webflux.routes[1].id=api-appointments
spring.cloud.gateway.server.webflux.routes[1].uri=lb://api-appointments
spring.cloud.gateway.server.webflux.routes[1].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[1].predicates[0].args[pattern]=/appointments/**
#Configuration api gateway routes[2]
spring.cloud.gateway.server.webflux.routes[2].id=api-security
spring.cloud.gateway.server.webflux.routes[2].uri=lb://api-security
spring.cloud.gateway.server.webflux.routes[2].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[2].predicates[0].args[pattern]=/security/**
# Configuration api gateway routes[3]
spring.cloud.gateway.server.webflux.routes[3].id=api-users
spring.cloud.gateway.server.webflux.routes[3].uri=lb://api-security
spring.cloud.gateway.server.webflux.routes[3].predicates[0].name=Path
spring.cloud.gateway.server.webflux.routes[3].predicates[0].args[pattern]=/users/**

#Personalizar el tipo de balanceo
#spring.cloud.loadbalancer.health-check.interval=10s
spring.cloud.loadbalancer.enabled=true

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.com.netflix.discovery=DEBUG

security.jwt.secret-key=${JWT_SECRET}