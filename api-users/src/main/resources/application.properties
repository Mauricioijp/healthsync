spring.application.name=api-users
server.port=8081

# Configuracion del datasource
## Cadena de conexion
spring.datasource.url=jdbc:mysql://localhost:3306/healthsync
## Usuario y contraseña de la base de datos
spring.datasource.username=root
spring.datasource.password=root
## Driver de conexion a la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
## Tipo de base de datos
spring.jpa.database=MYSQL
## Formato de las sentencias SQL
spring.jpa.properties.hibernate.format_sql=false
## Mostrar las sentencias SQL en la consola (Se deshabilita para ambientes productivos)
spring.jpa.show-sql=false
## Habilit la generacion de la base de datos a partir de las entidades JPA (Se deshabilita para ambientes productivos)
spring.jpa.hibernate.ddl-auto=none

# Configuracion Swagger
## Especifica la ruta donde se publicaran el contrato del api
springdoc.api-docs.path=/api-docs
## Especifica la ruta donde se publicara la interfaz del swagger
springdoc.swagger-ui.path=/
## Especifica la activacion de la interfaz del swagger
springdoc.swagger-ui.enabled=true
## Configuracion de la interfaz del swagger
## Especifica el orden de los endpoints en la interfaz del swagger (# Orden por metodo | # Orden alfabetico)
springdoc.swagger-ui.operationsSorter=method
## Especifica el titulo de tu api
springdoc.open-api.info.title=API USERS
## Especifica la descripcion de tu api
springdoc.open-api.info.description=API REST for users management
## Especifica la version de tu api
springdoc.open-api.info.version=1.0.0
