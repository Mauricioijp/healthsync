spring.application.name=eureka-server

# Server port
server.port = 8761

# Eureka server properties
## The server does not register itself
eureka.client.register-with-eureka=false
## The server does not query the service registry
eureka.client.fetch-registry=false
## Define the hostname of the Eureka server
eureka.instance.hostname=localhost
## Specify that the server should use its IP address instead of the hostname
eureka.instance.prefer-ip-address=false
eureka.instance.ip-address=127.0.0.1
## Specify that the instance ID uses a specific structure
eureka.instance.instance-id=${spring.application.name}:${server.port}
## Properties for the Eureka server's health monitoring
### Specify that Eureka should mark services as unavailable if they don't respond to requests
eureka.server.enable-self-preservation=true
### Specify the time interval at which Eureka checks if services are available
eureka.server.expected-client-renewal-interval-seconds=30
### Specify the renewal threshold for clients in percentage
eureka.server.renewal-percent-threshold=0.85

# Connect as a client
#eureka.client.service-url.defaultZone=http://localhost:8762/eureka/,http://localhost:8761/eureka/

